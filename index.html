<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offboarding Test — Fibertech</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Fibertech · HR test environment</p>
      <h1>Employee Offboarding</h1>
    </div>
    <div class="top-actions">
      <label class="role-label">Act as
        <select id="roleSelect"></select>
      </label>
      <button type="button" id="navCase" class="btn btn-ghost">Case</button>
      <button type="button" id="navEmails" class="btn btn-ghost">Emails</button>
      <button type="button" id="navReports" class="btn btn-ghost">Reports</button>
      <button type="button" id="resetBtn" class="btn btn-ghost">Reset test</button>
    </div>
  </header>

  <main class="layout">
    <aside id="timeline" class="panel"></aside>
    <section id="mainPanel" class="panel panel-main"></section>
    <aside id="auditPanel" class="panel"></aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/state.js"></script>
  <script src="js/share.js"></script>
  <script src="js/email.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/render.js"></script>
  <script src="js/views.js"></script>
  <script src="js/report.js"></script>
  <script src="js/handlers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
